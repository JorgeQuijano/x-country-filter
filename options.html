<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X Country Filter — Options</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 560px; margin: 32px auto; padding: 0 16px; color: #0f1419; }
  h1 { font-size: 20px; }
  section { margin-bottom: 28px; }
  label { display: block; margin: 10px 0; font-size: 14px; }
  input[type="text"] { padding: 6px 10px; font-size: 14px; width: 120px; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 8px 16px; font-size: 14px; border: 0; border-radius: 999px; background: #1d9bf0; color: #fff; cursor: pointer; }
  button.secondary { background: #e7e7e7; color: #0f1419; margin-left: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { background: #e8f0fe; border: 1px solid #b7d3f0; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .chip button { background: none; border: 0; color: #d93025; font-size: 14px; cursor: pointer; padding: 0 0 0 6px; }
  .status { color: #188038; font-size: 13px; min-height: 18px; margin-top: 8px; }
  textarea { width: 100%; height: 180px; font-family: monospace; font-size: 12px; }
  small { color: #536471; }
</style>
</head>
<body>
  <h1>X Country Filter</h1>

  <section>
    <label><input type="checkbox" id="enabled" checked> Enable filtering</label>
    <label><input type="checkbox" id="hideFollowing" checked> Hide posts even from accounts I follow</label>
  </section>

  <section>
    <div>Hide accounts based in:</div>
    <div class="chips" id="chips"></div>
    <div style="margin-top:12px">
      <input type="text" id="newCountry" placeholder="e.g. IN" maxlength="2">
      <button id="addBtn">Add</button>
    </div>
    <small>ISO country codes (alpha-2). Default: IN (India).</small>
  </section>

  <section>
    <button id="clearCache" class="secondary">Clear lookup cache</button>
    <button id="exportDebug">Export debug data (for Tay)</button>
    <div class="status" id="status"></div>
  </section>

  <section id="debugSection" style="display:none">
    <div>Copy this and paste it to Tay in the chat:</div>
    <textarea id="debugOut" readonly></textarea>
  </section>

<script src="options.js"></script>
</body>
</html>
